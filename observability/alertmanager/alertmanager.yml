global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: slack-outbox
  group_by: [alertname, service, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: pagerduty-critical
      matchers:
        - severity="critical"
      continue: true
    - receiver: slack-outbox
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: slack-outbox
    slack_configs:
      - channel: "#ai-stylist-alerts"
        send_resolved: true
        title: '{{ template "ai_stylist.title" . }}'
        text: '{{ template "ai_stylist.body" . }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
        severity: '{{ .CommonLabels.severity | default "critical" }}'
        component: '{{ .CommonLabels.component | default "outbox" }}'
        group: '{{ .CommonLabels.service | default "ai-stylist" }}'
        class: '{{ .CommonLabels.alertname }}'
        description: '{{ template "ai_stylist.pagerduty_description" . }}'
        details:
          runbook: '{{ (index .Alerts 0).Annotations.runbook }}'
          firing_count: '{{ len .Alerts.Firing }}'
          alert_names: '{{ range .Alerts }}{{ .Labels.alertname }} {{ end }}'
        send_resolved: true
