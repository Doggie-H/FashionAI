global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/outbox-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ai-stylist-api
    metrics_path: /metrics
    static_configs:
      # Replace with the API service DNS name in production. host.docker.internal is suitable for Docker Desktop local development.
      - targets: ["host.docker.internal:8000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
